# Non-sensitive configuration via a ConfigMap.
# The Deployment currently sets APP_PORT inline; this shows how to externalize it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-app-config
  namespace: msc-de1-project
data:
  APP_PORT: "5000"
---
# TEMPLATE ONLY — never commit a real secret value to Git.
# Create the real secret at runtime with:
#   kubectl -n msc-de1-project create secret generic flask-app-secret \
#     --from-literal=EXAMPLE_KEY=changeme
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: flask-app-secret
#   namespace: msc-de1-project
# type: Opaque
# stringData:
#   EXAMPLE_KEY: "<provided-at-runtime>"